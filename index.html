<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEWS</title>
<meta name="description" content="DEWS — disaster readiness in English and 中文. Works offline.">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ===== DEWS v2 tokens ===== */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#E8E5DE; --line:#D6D2C8;
  --ink:#16191C; --ink-2:#464B52; --ink-3:#62676E;
  --primary:#16191C; --on-primary:#FFFFFF;
  --red:#C42B21; --red-text:#A8231B; --on-red:#FFFFFF; --red-soft:#F7E1DD;
  --orange:#F07C1F; --orange-text:#A84E0A; --on-orange:#16191C;
  --yellow:#F5CF2E; --on-yellow:#16191C;
  --green:#1C7A4A; --green-text:#176A40; --on-green:#FFFFFF; --green-soft:#DCEFE3;
  --blue:#1F5FAD; --on-blue:#FFFFFF;
  --focus:#1F5FAD;
  --scrim:rgba(10,12,14,.55);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --tap:56px; --tap-lg:72px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1113; --surface:#181B1E; --surface-2:#22262A; --line:#30353A;
    --ink:#F1EFEA; --ink-2:#BEC2C7; --ink-3:#959AA0;
    --primary:#F1EFEA; --on-primary:#0F1113;
    --red:#C9362B; --red-text:#FF8478; --red-soft:#3A1A17;
    --orange-text:#F59A4A; --green:#1C7A4A; --green-text:#5BCB8E; --green-soft:#16301F;
    --blue:#2A6CC0; --focus:#7FB0FF; --scrim:rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"], body.em{
  --bg:#0F1113; --surface:#181B1E; --surface-2:#22262A; --line:#30353A;
  --ink:#F1EFEA; --ink-2:#BEC2C7; --ink-3:#959AA0;
  --primary:#F1EFEA; --on-primary:#0F1113;
  --red:#C9362B; --red-text:#FF8478; --red-soft:#3A1A17;
  --orange-text:#F59A4A; --green:#1C7A4A; --green-text:#5BCB8E; --green-soft:#16301F;
  --blue:#2A6CC0; --focus:#7FB0FF; --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
body.em{ --bg:#0A0B0C; }
:root[data-size="lg"]{ font-size:112.5%; }

/* ===== base ===== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:1.0625rem;line-height:1.5;
  min-height:100vh;min-height:100dvh;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:32px;height:32px}
.ic.xl{width:48px;height:48px;stroke-width:1.75}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--s4) calc(96px + env(safe-area-inset-bottom))}
body.em .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:var(--s3);
  max-width:520px;margin:0 auto;padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3)}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:.06em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;line-height:1;
  padding:6px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip .ic{width:14px;height:14px;stroke-width:2.5}
.chip.ok{background:var(--green-soft);color:var(--green-text)}
.chip.sample{background:transparent;border:1.5px dashed currentColor;padding:4px 8px}
.top .sp{flex:1}
.sosbtn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:var(--r-pill);
  background:var(--red);color:var(--on-red);font-weight:700;font-size:.9375rem}
.sosbtn .ic{width:20px;height:20px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;border-radius:var(--r-pill);font-weight:600}
.em-label{font-weight:700;font-size:.875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red-text)}

/* ===== tabs ===== */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;font-size:.75rem;font-weight:600;color:var(--ink-3)}
.tabs a.on{color:var(--ink)}
.tabs a.on .ic{stroke-width:2.5}
body.em .tabs{display:none}

/* ===== type ===== */
h1{font-size:2rem;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.1875rem;line-height:1.35;font-weight:700}
.eyebrow,.label{font-size:.8125rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
:lang(zh) .eyebrow,:lang(zh) .label{letter-spacing:.02em}
.label{margin:var(--s6) 0 var(--s3)}
.sub{color:var(--ink-2);margin-top:var(--s2)}
.small{font-size:.875rem;color:var(--ink-2)}
.page-head{padding:var(--s3) 0 var(--s4)}
.page-head .eyebrow{margin-bottom:var(--s2)}

/* ===== cards & rows ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4)}
.stack>*+*{margin-top:var(--s3)}
.row{display:flex;align-items:center;gap:var(--s3)}
.row .grow{flex:1;min-width:0}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.link-row{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:var(--s3) var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.link-row .t{font-weight:650}
.link-row .d{font-size:.875rem;color:var(--ink-2)}
.link-row .chev{color:var(--ink-3)}
.badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink);flex:none}

/* ===== buttons ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--tap);
  padding:var(--s3) var(--s4);border-radius:var(--r-md);font-weight:700;font-size:1.0625rem;text-align:center}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-line{border:1.5px solid var(--line);background:var(--surface)}
.btn-ghost{color:var(--ink-2);font-weight:600;min-height:44px}
.btn-lg{min-height:var(--tap-lg);font-size:1.25rem;border-radius:var(--r-lg)}

/* ===== alert card ===== */
.alert{display:block;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.alert-band{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);font-weight:800;font-size:1rem}
.alert-band .chip{margin-left:auto;color:inherit}
.lv-emergency .alert-band{background:var(--red);color:var(--on-red)}
.lv-watch .alert-band{background:var(--orange);color:var(--on-orange)}
.lv-advice .alert-band{background:var(--yellow);color:var(--on-yellow)}
.alert-body{padding:var(--s4)}
.alert-act{font-size:1.75rem;font-weight:800;line-height:1.2}
.alert-meta{color:var(--ink-2);font-size:.9375rem;margin-top:var(--s1)}
.alert.none .alert-body{display:flex;gap:var(--s3);align-items:flex-start}
.alert.none .ic{color:var(--green-text);margin-top:2px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:var(--s4)}
.meter i{height:8px;border-radius:4px;background:var(--surface-2)}
.meter i.f1{background:var(--yellow)} .meter i.f2{background:var(--orange)} .meter i.f3{background:var(--red)}
.meter-l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;font-size:.6875rem;font-weight:600;color:var(--ink-3)}
.meter-l span.on{color:var(--ink)}
.textlink{display:inline-flex;align-items:center;gap:4px;font-weight:650;margin-top:var(--s3);min-height:44px}
.textlink .ic{width:18px;height:18px}

/* ===== big emergency entry ===== */
.em-entry{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s4);padding:var(--s4) var(--s5);min-height:96px;
  background:var(--red);color:var(--on-red);border-radius:var(--r-lg)}
.em-entry b{display:block;font-size:1.375rem;line-height:1.25}
.em-entry span{display:block;font-size:.9375rem;opacity:.92;margin-top:2px}

/* ===== readiness ===== */
.ready-num{font-size:2.25rem;font-weight:800;line-height:1}
.ready-num small{font-size:1rem;color:var(--ink-3);font-weight:700}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:var(--s4)}
.seg i{display:block;height:10px;border-radius:5px;background:var(--surface-2)}
.seg.on i{background:var(--green)}
.seg span{display:block;font-size:.75rem;font-weight:600;color:var(--ink-3);margin-top:6px}
.seg.on span{color:var(--ink)}
.next{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line);min-height:var(--tap)}
.next .grow{font-weight:650}
.next .eyebrow{display:block;margin-bottom:2px}

/* ===== numbers ===== */
.num{display:flex;align-items:center;gap:var(--s4);min-height:var(--tap-lg);padding:var(--s3) var(--s4);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-md)}
.num+.num{margin-top:var(--s2)}
.num-n{font-size:1.625rem;font-weight:800;min-width:5.6ch;letter-spacing:.01em}
.num .grow{color:var(--ink-2);font-size:.9375rem;line-height:1.35}
.num .ic{color:var(--ink-3)}
.num.red .num-n{color:var(--red-text)}

/* ===== sheet / modal ===== */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet h2{font-size:1.5rem;line-height:1.25;margin:var(--s3) 0 var(--s5)}
.sheet .btn+.btn{margin-top:var(--s3)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* ===== emergency mode ===== */
.em-actions{display:grid;gap:var(--s3);margin-top:var(--s2)}
.em-two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.emb{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap-lg);padding:var(--s3) var(--s4);border-radius:var(--r-lg);
  background:var(--surface-2);color:var(--ink);font-weight:700;font-size:1.0625rem;line-height:1.25;text-align:left;width:100%}
.emb.red{background:var(--red);color:var(--on-red);font-size:1.5rem;min-height:88px;justify-content:center}
.emb.red .ic{width:32px;height:32px}
.em-two .emb{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:104px}
.em-h{font-size:1.75rem;margin:var(--s6) 0 var(--s3)}
.hz{display:flex;align-items:center;gap:var(--s4);min-height:var(--tap-lg);padding:0 var(--s4);border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);font-size:1.375rem;font-weight:700}
.hz+.hz{margin-top:var(--s2)}
.hz .ic{width:30px;height:30px}
.hz .chev{margin-left:auto;color:var(--ink-3)}
.hz.ctx{border-color:var(--red);border-width:2px}
.hz .tag{font-size:.75rem;font-weight:700;color:var(--red-text);margin-left:auto;margin-right:var(--s2)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s3);padding:var(--s4);min-height:104px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);font-weight:700;text-align:left}
.ctx-strip{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--red);color:var(--on-red);font-weight:700;margin-bottom:var(--s3)}
.ctx-strip .chip{background:transparent;color:inherit;border-color:currentColor}
/* hazard guide */
.hz-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 0 var(--s4)}
.hz-head h1{font-size:2.25rem}
.fork-q{font-size:1.75rem;font-weight:800;line-height:1.25;margin-bottom:var(--s5)}
.fork-o{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:96px;padding:var(--s4) var(--s5);border-radius:var(--r-lg);
  background:var(--surface);border:2px solid var(--line);font-size:1.375rem;font-weight:700;line-height:1.25}
.fork-o+.fork-o{margin-top:var(--s3)}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:.8125rem;font-weight:700;letter-spacing:.04em;color:var(--ink-3)}
.kind::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.kind.k-evacuate{color:var(--orange-text)} .kind.k-shelter{color:var(--green-text)} .kind.k-contain{color:var(--red-text)}
.hz-mini{display:flex;align-items:center;gap:var(--s2);font-weight:700;color:var(--ink-2);padding:var(--s2) 0 var(--s3)}
.hz-mini .kind{margin-left:var(--s2)}
.now{background:var(--ink);color:var(--bg);border-radius:var(--r-lg);padding:var(--s5)}
.now-l{display:block;font-size:.8125rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:var(--s2)}
.now p{font-size:1.75rem;line-height:1.3;font-weight:750}
.now a{text-decoration:underline;text-underline-offset:3px}
.steps{list-style:none;margin-top:var(--s5)}
.steps li{display:flex;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--line)}
.steps .n{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-2)}
.steps p{font-size:1.3125rem;line-height:1.4;font-weight:600}
.steps p a{text-decoration:underline;text-underline-offset:3px}
.src{font-size:.8125rem;color:var(--ink-3);margin-top:var(--s5);line-height:1.5}
.src a{text-decoration:underline;text-underline-offset:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom))}
.dock-in{max-width:520px;margin:0 auto;display:flex;gap:var(--s3)}
.dock .btn{min-height:64px;font-size:1.1875rem}
/* forms */
.field{display:block;margin-top:var(--s4)}
.field>span{display:block;font-weight:650;margin-bottom:var(--s2)}
.input{width:100%;min-height:var(--tap);padding:var(--s3) var(--s4);border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:1.0625rem}
textarea.input{min-height:96px;resize:vertical}
.input::placeholder{color:var(--ink-3)}
.seg-ctl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--surface-2)}
.seg-ctl button{min-height:48px;border-radius:12px;font-weight:650;color:var(--ink-2);padding:0 var(--s2)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg-ctl.danger button.sel-serious[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.pick{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 var(--s4);border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);font-weight:650}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick .ic{width:18px;height:18px;stroke-width:2.5}
.stepper{display:flex;align-items:center;gap:var(--s3)}
.stepper button{width:var(--tap);height:var(--tap);border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.stepper output{min-width:3ch;text-align:center;font-size:1.75rem;font-weight:800}
.toggle{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);width:100%;text-align:left;font-weight:600}
.toggle .sw{flex:none;width:52px;height:32px;border-radius:16px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--ink-3);transition:transform .15s,background .15s}
.toggle[aria-pressed="true"] .sw{background:var(--green);border-color:var(--green)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(20px);background:#fff}
.callout{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2);font-size:.9375rem;line-height:1.45}
.callout.red{background:var(--red-soft);color:var(--ink)}
.callout.red .ic{color:var(--red-text)}
.callout .ic{margin-top:1px}
.demo{border:1.5px dashed var(--ink-3);background:transparent;color:var(--ink-2)}
/* help sent */
.sent-check{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:var(--s5) 0 var(--s4)}
.sent-check .ic{width:40px;height:40px;stroke-width:3}
.eta{margin-top:var(--s5);padding:var(--s5);border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.eta-v{font-size:2.75rem;font-weight:800;line-height:1.1;margin:var(--s2) 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);font-size:.9375rem}
.kv dt{color:var(--ink-3);font-weight:600}
.bullets{list-style:none}
.bullets li{display:flex;gap:var(--s3);padding:var(--s2) 0}
.bullets li::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--ink-3);margin-top:.6em}
/* tool overlays */
.ov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);padding:var(--s5);text-align:center;cursor:pointer}
.ov.white{background:#fff;color:#62676E}
.ov.black{background:#000;color:#959AA0}
.ov.flash-on{background:#fff}
.ov .big{font-size:1.5rem;font-weight:800;color:#F1EFEA}
.ov.white .big{color:#16191C}
.ov .hint{font-size:1rem}
.helpcard{position:fixed;inset:0;z-index:90;background:var(--red);color:#fff;overflow:auto;padding:calc(var(--s5) + env(safe-area-inset-top)) var(--s5) var(--s6)}
.helpcard .hc-in{max-width:560px;margin:0 auto}
.helpcard .hc-big{font-size:clamp(3rem,15vw,5.5rem);line-height:1;font-weight:900;letter-spacing:-.02em;margin-top:var(--s5)}
.helpcard .hc-zh{font-size:1.5rem;font-weight:700;opacity:.9;margin-top:var(--s2)}
.helpcard .hc-line{font-size:1.75rem;font-weight:800;line-height:1.25;margin-top:var(--s5)}
.helpcard dl{margin-top:var(--s5);background:rgba(0,0,0,.18);border-radius:var(--r-md);padding:var(--s4);display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);font-size:1.0625rem}
.helpcard dt{opacity:.85;font-weight:600}
.helpcard dd{font-weight:700}
.helpcard .btn{margin-top:var(--s5);background:#fff;color:#16191C}
/* prepare */
.prep-card{display:block;padding:var(--s4) var(--s4) var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.prep-card+.prep-card{margin-top:var(--s3)}
.prep-card .row{align-items:flex-start}
.prep-card h2{font-size:1.25rem}
.bar{height:8px;border-radius:4px;background:var(--surface-2);margin-top:var(--s4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.prep-card .meta{font-size:.875rem;font-weight:650;color:var(--ink-2);margin-top:var(--s2)}
.calc{display:grid;grid-template-columns:1fr auto;gap:var(--s4);align-items:center}
.water{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2);display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.water b{font-size:2.75rem;line-height:1;font-weight:800}
.check{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:var(--s2) 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.check .bx{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;color:transparent}
.check .bx .ic{width:18px;height:18px;stroke-width:3}
.check[aria-pressed="true"] .bx{background:var(--green);border-color:var(--green);color:#fff}
.check[aria-pressed="true"] .tx{color:var(--ink-3)}
.check .qty{margin-left:auto;font-weight:700;color:var(--ink-2)}
.person{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--s2);margin-top:var(--s2)}
.person .rm{width:var(--tap);height:var(--tap);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
/* quiz */
.qprog{display:flex;gap:4px;margin-bottom:var(--s5)}
.qprog i{flex:1;height:6px;border-radius:3px;background:var(--surface-2)}
.qprog i.done{background:var(--ink)}
.qq{font-size:1.5rem;font-weight:800;line-height:1.3}
.qa{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);margin-top:var(--s3);border-radius:var(--r-md);
  border:2px solid var(--line);background:var(--surface);font-weight:650;text-align:left;font-size:1.0625rem}
.qa.right{border-color:var(--green);background:var(--green-soft)}
.qa.wrong{border-color:var(--red);background:var(--red-soft)}
.qa .ic{margin-left:auto}
.qa.right .ic{color:var(--green-text)} .qa.wrong .ic{color:var(--red-text)}
.why{margin-top:var(--s4);padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2)}
.why b{display:block;margin-bottom:var(--s1)}
.score{font-size:4rem;font-weight:900;line-height:1;margin:var(--s5) 0 var(--s2)}
/* map */
.filters .pick{flex:none;white-space:nowrap}
.filters{display:flex;gap:var(--s2);overflow-x:auto;padding-bottom:var(--s1);margin:0 calc(-1 * var(--s4));padding-left:var(--s4);padding-right:var(--s4);scrollbar-width:none}
.radar-wrap{margin-top:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3);position:relative}
.radar{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;transition:transform .2s linear}
.radar svg.rings{position:absolute;inset:0;width:100%;height:100%}
.rings circle{fill:none;stroke:var(--line);stroke-width:1.5}
.rings text{fill:var(--ink-3);font-size:11px;font-weight:600;font-family:var(--font)}
.rings line{stroke:var(--line);stroke-width:1}
.me-dot{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--blue);border:3px solid var(--surface);box-shadow:0 0 0 6px rgba(31,95,173,.18)}
.mk{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid var(--surface)}
.mk .ic{width:18px;height:18px;stroke-width:2.5}
.t-shelter{background:var(--green)} .t-hospital{background:var(--red)} .t-water{background:var(--blue)} .t-power{background:var(--ink-2)}
.north{position:absolute;top:var(--s3);left:50%;transform:translateX(-50%);font-size:.75rem;font-weight:800;color:var(--ink-2);background:var(--surface);padding:0 4px}
.pl{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.pl .mk{position:static;margin:0;border:0;width:40px;height:40px}
.pl .nm{font-weight:700;line-height:1.3}
.pl .nt{font-size:.875rem;color:var(--ink-2)}
.pl .dist{text-align:right;font-weight:800;white-space:nowrap}
.pl .dir{display:flex;align-items:center;justify-content:flex-end;gap:2px;font-size:.8125rem;font-weight:600;color:var(--ink-3)}
.pl .dir .ic{width:16px;height:16px;transition:transform .2s linear}
/* me */
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.idcard-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--ink);color:var(--bg);font-weight:800;letter-spacing:.06em;font-size:.875rem}
.idcard-b{padding:var(--s4)}
.idcard .nm{font-size:1.5rem;font-weight:800}
.idcard .kv{margin-top:var(--s3)}
.set{margin-top:var(--s4)}
.set>span{display:block;font-weight:650;margin-bottom:var(--s2)}
.src-list a{display:block;padding:var(--s3) 0;border-top:1px solid var(--line)}
.src-list b{display:block;font-weight:650}
.src-list span{font-size:.8125rem;color:var(--ink-3);word-break:break-all}
/* onboarding */
.ob{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
.ob-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--s7) + env(safe-area-inset-top)) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom))}
.mark{width:64px;height:64px}
.ob h1{margin-top:var(--s6)}
.lang-pick{display:grid;gap:var(--s3);margin-top:var(--s5)}
.lang-pick button{display:flex;align-items:center;justify-content:space-between;min-height:var(--tap-lg);padding:0 var(--s5);border-radius:var(--r-lg);border:2px solid var(--line);background:var(--surface);font-size:1.375rem;font-weight:700}
.lang-pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lang-pick button .ic{opacity:0}
.lang-pick button[aria-pressed="true"] .ic{opacity:1}
.ob .sp{flex:1;min-height:var(--s6)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r-md);font-weight:600;font-size:.9375rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.offbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);margin-bottom:var(--s3);border-radius:var(--r-sm);background:var(--surface-2);font-size:.875rem;font-weight:600;color:var(--ink-2)}
.offbar .ic{width:18px;height:18px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){ body{background:var(--bg)} }
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<noscript><p style="padding:24px">DEWS needs JavaScript. In a life-threatening emergency, call 000.</p></noscript>
<script src="content.js"></script>
<script>
(function(){
'use strict';

/* ---------- state ---------- */
var KEY = 'dews2';
var DEFAULTS = {
  lang: null, size: 'std', theme: 'auto',
  kit: { people: 1, baby: false, pet: false, have: {} },
  plan: { people: [{ name: '', phone: '' }], near: '', far: '', contact: '', trigger: '' },
  card: { name: '', lang: '', blood: '', allergies: '', meds: '', conditions: '', contactName: '', contactPhone: '', address: '' },
  quiz: { best: null },
  demo: { alert: false, answered: false }
};
var S = load();
function load(){
  var d = JSON.parse(JSON.stringify(DEFAULTS));
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) for (var k in d) if (s[k] !== undefined) d[k] = s[k];
    if (!d.lang) { var old = localStorage.getItem('dews-lang'); if (old === 'zh' || old === 'en') d.pre = old; }
  } catch (e) {}
  return d;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* transient */
var CI = null;             /* check-in sheet stage */
var Q = null;              /* quiz run */
var HR = null;             /* help request draft */
var heading = null;        /* compass heading in degrees */
var here = null;           /* {lat,lng} if user shared */
var swReady = false;
var filter = 'all';
var resetArmed = false;

/* ---------- helpers ---------- */
function li(){ return S.lang === 'zh' ? 1 : 0; }
function tx(a){ return a ? a[li()] : ''; }
function t(k){ return STR[k] ? STR[k][li()] : k; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function linkify(s){
  return esc(s).replace(/\b000\b/g, '<a href="tel:000">000</a>').replace(/132 500/g, '<a href="tel:132500">132 500</a>');
}
function hz(id){ for (var i = 0; i < HAZARDS.length; i++) if (HAZARDS[i].id === id) return HAZARDS[i]; return null; }
function srcLine(key){
  var s = SOURCES[key]; if (!s) return '';
  return '<p class="src">' + t('source') + ': <a href="' + s.u + '" target="_blank" rel="noopener">' + esc(s.t) + '</a> · ' + t('checked') + ' ' + CONTENT_CHECKED + '</p>';
}
function toast(msg){
  var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3200);
}
function getPath(o, p){ return p.split('.').reduce(function(a, k){ return a == null ? a : a[k]; }, o); }
function setPath(o, p, v){ var ks = p.split('.'), last = ks.pop(); var tgt = ks.reduce(function(a, k){ return a[k]; }, o); tgt[last] = v; }

/* ---------- icons ---------- */
var P = {
  fire:'<path d="M12 21a6 6 0 0 0 6-6c0-4-3-6-4-10-2 2-3 4-3 6-1-1-1.5-2-1.5-3C7 9.5 6 12 6 15a6 6 0 0 0 6 6z"/>',
  flood:'<path d="M5 11V7.5L12 3l7 4.5V11"/><path d="M2 15c2 0 2-1.5 4-1.5S8 15 10 15s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 19.5c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/>',
  storm:'<path d="M7 16a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19 9a3.5 3.5 0 0 1-1 7"/><path d="M13 12l-3 5h4l-2 5"/>',
  heat:'<path d="M10 14.5V5a2 2 0 1 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 10v7"/><path d="M18 5h3M18 9h2"/>',
  quake:'<path d="M2 12h4l2-6 3 12 3-9 2 3h6"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
  drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  chevR:'<path d="M9 5l7 7-7 7"/>', chevL:'<path d="M15 5l-7 7 7 7"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/>',
  pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  torch:'<path d="M8 3h8v4l-2 3v11h-4V10L8 7z"/><path d="M12 13v2"/>',
  flash:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  whistle:'<path d="M3 10h12a5 5 0 1 1-5 5"/><path d="M3 10v4h6"/><path d="M14 6l1.5-3M18 7.5l3-1.5"/>',
  card:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M6 16c.5-1.5 1.5-2 2.5-2s2 .5 2.5 2M14 10h4M14 13h4"/>',
  msg:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5l2 2 4-4"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.5-5 6.5-5s5.7 1.5 6.5 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.5 5"/>',
  bag:'<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2M4 12h16M12 10v4"/>',
  quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17v.01"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  arrow:'<path d="M12 3l6 17-6-4-6 4z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  wifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0M12 19v.01"/><path d="M3 3l18 18"/>',
  locate:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'
};
function ic(n, cls){ return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (P[n] || '') + '</svg>'; }
var MARK = '<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#16191C"/><path d="M14 34L32 18l18 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 46h36" stroke="#fff" stroke-width="6" stroke-linecap="round"/><rect x="28.5" y="30" width="7" height="7" rx="1.5" fill="#E2483D"/></svg>';

/* ---------- readiness ---------- */
function kitItems(){
  var items = KIT.items.slice();
  if (S.kit.baby) items.push(KIT.baby);
  if (S.kit.pet) items.push(KIT.pet);
  return items;
}
function kitDone(){ var it = kitItems(), n = 0; it.forEach(function(i){ if (S.kit.have[i[0]]) n++; }); return { n: n, total: it.length }; }
function planDone(){
  var p = S.plan, n = 0;
  if (p.people.some(function(x){ return x.name && x.phone; })) n++;
  if (p.near) n++; if (p.far) n++; if (p.contact) n++; if (p.trigger) n++;
  return { n: n, total: 5 };
}
function cardDone(){ var c = S.card; return !!(c.name && (c.contactPhone || c.allergies || c.meds || c.blood)); }
function readiness(){
  var k = kitDone(), p = planDone();
  return [
    { id: 'card', on: cardDone(), label: ['Card', '应急卡'], ns: 'nsCard', href: '#/me/card' },
    { id: 'plan', on: p.n >= 3, label: ['Plan', '计划'], ns: 'nsPlan', href: '#/prepare/plan' },
    { id: 'kit', on: k.n / k.total >= 0.8, label: ['Kit', '应急包'], ns: 'nsKit', href: '#/prepare/kit' },
    { id: 'quiz', on: S.quiz.best != null, label: ['Practice', '练习'], ns: 'nsQuiz', href: '#/prepare/quiz' }
  ];
}

/* ---------- router ---------- */
function parts(){ return location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); }
function render(){
  var p = parts(), main = '', top = '', dock = '', em = p[0] === 'sos';
  document.documentElement.lang = li() ? 'zh-CN' : 'en';
  document.documentElement.setAttribute('data-size', S.size);
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  document.body.classList.toggle('em', em);
  document.title = em ? 'DEWS — ' + t('sos') : 'DEWS';

  if (em) {
    var r = sosRoute(p); main = r.main; dock = r.dock || ''; top = emTop(p.length > 1 ? r.back || '#/sos' : null);
  } else {
    top = normalTop();
    if (p[0] === 'prepare') main = p[1] === 'kit' ? vKit() : p[1] === 'plan' ? vPlan() : p[1] === 'quiz' ? vQuiz() : vPrepare();
    else if (p[0] === 'map') main = vMap();
    else if (p[0] === 'me') main = p[1] === 'card' ? vCardEdit() : p[1] === 'sources' ? vSources() : vMe();
    else if (p[0] === 'alert') main = vAlert();
    else main = vHome();
  }
  var tab = p[0] === 'prepare' ? 'prepare' : p[0] === 'map' ? 'map' : p[0] === 'me' ? 'me' : 'home';
  var tabs = '<nav class="tabs" aria-label="Main"><div class="tabs-in">' +
    tabLink('#/', 'sun', t('tabHome'), tab === 'home') +
    tabLink('#/prepare', 'shield', t('tabPrep'), tab === 'prepare') +
    tabLink('#/map', 'pin', t('tabMap'), tab === 'map') +
    tabLink('#/me', 'user', t('tabMe'), tab === 'me') + '</div></nav>';
  document.getElementById('app').innerHTML = top + '<main class="wrap" id="main">' + offlineBar() + main + '</main>' + (em ? dock : tabs);
  renderLayer();
  after(p);
}
function tabLink(h, i, l, on){ return '<a href="' + h + '"' + (on ? ' class="on" aria-current="page"' : '') + '>' + ic(i) + '<span>' + l + '</span></a>'; }
function offChip(){
  if (!('serviceWorker' in navigator)) return '';
  return swReady ? '<span class="chip ok">' + ic('check') + t('offlineReady') + '</span>' : '<span class="chip">' + t('offlineNot') + '</span>';
}
function offlineBar(){ return navigator.onLine === false ? '<div class="offbar">' + ic('wifi') + t('youreOffline') + '</div>' : ''; }
function normalTop(){
  return '<header class="top"><a class="brand" href="#/" aria-label="DEWS home">DEWS</a>' + offChip() + '<span class="sp"></span>' +
    '<a class="sosbtn" href="#/sos">' + ic('alert') + t('sos') + '</a></header>';
}
function emTop(back){
  return '<header class="top">' +
    (back ? '<a class="iconbtn" href="' + back + '">' + ic('chevL') + t('back') + '</a>' : '<a class="iconbtn" href="#/">' + ic('x') + t('exitEmergency') + '</a>') +
    '<span class="sp"></span><span class="em-label">' + t('sos') + '</span></header>';
}

/* ---------- HOME ---------- */
function dateLine(){
  try { return new Date().toLocaleDateString(li() ? 'zh-CN' : 'en-AU', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return ''; }
}
function alertCard(){
  if (S.demo.alert) {
    var a = SAMPLE_ALERT, L = LEVELS[a.level], h = hz(a.hazard);
    return '<a class="alert lv-' + a.level + '" href="#/alert">' +
      '<div class="alert-band">' + ic(h.icon) + esc(tx(L.name)) + '<span class="chip sample">' + t('sample') + '</span></div>' +
      '<div class="alert-body"><div class="alert-act">' + esc(tx(a.action)) + '</div>' +
      '<div class="alert-meta">' + esc(tx(h.name)) + ' · ' + esc(tx(a.area)) + ' · ' + t('issued') + ' ' + a.issued + '</div>' +

    [50, 100, 150].map(function(r){ return '<circle r="' + r + '"/>'; }).join('') +
    '<text x="4" y="46">500 m</text><text x="4" y="96">1 km</text><text x="4" y="146">1.5 km</text></svg>' +

      var l = 50 + x.p.dx / (RANGE * 2) * 100, tp = 50 + x.p.dy / (RANGE * 2) * 100;
      return '<span class="mk t-' + x.p.type + '" style="left:' + l + '%;top:' + tp + '%;transform:rotate(' + (-rot) + 'deg)" title="' + esc(tx(x.p.name)) + '">' + ic(PLACE_TYPES[x.p.type].icon) + '</span>';

    }).join('') + '</section>';
}

/* ---------- layer: onboarding, sheets, tools ---------- */
var TOOL = null, toolTimer = null, audio = null, wake = null;
function renderLayer(){
  var L = document.getElementById('layer'), h = '';
  var p = parts();
  if (!S.lang) h = onboarding();
  else if (TOOL) h = toolView();
  else if (CI) h = checkinSheet();
  else if (S.demo.alert && !S.demo.answered && (p.length === 0)) { CI = 'affected'; h = checkinSheet(); }
  L.innerHTML = h;
}
function onboarding(){
  var pick = S.pre || 'en', zh = pick === 'zh';
  function T(k){ return STR[k][zh ? 1 : 0]; }
  return '<div class="ob" role="dialog" aria-modal="true"><div class="ob-in">' + MARK +
    '<h1>' + T('obTitle') + '</h1><p class="sub">' + T('obSub') + '</p>' +
    '<div class="lang-pick"><button data-a="obLang" data-v="en" aria-pressed="' + !zh + '">English' + ic('check') + '</button>' +
    '<button data-a="obLang" data-v="zh" aria-pressed="' + zh + '">中文' + ic('check') + '</button></div>' +
    '<div class="sp"></div><div class="callout">' + ic('shield') + '<span>' + T('obNote') + '</span></div>' +
    '<button class="btn btn-lg btn-primary" style="margin-top:16px" data-a="obStart">' + T('obStart') + '</button></div></div>';
}
function toolView(){
  if (TOOL === 'torch') return '<div class="ov white" data-a="toolStop"><span class="hint">' + t('torchNote') + '</span><span class="hint">' + t('tapToStop') + '</span></div>';
  if (TOOL === 'flash') return '<div class="ov black" id="flash" data-a="toolStop"><span class="big">SOS</span><span class="hint">' + t('flashNote') + '</span><span class="hint">' + t('tapToStop') + '</span></div>';
  if (TOOL === 'whistle') return '<div class="ov black" data-a="toolStop">' + ic('whistle', 'xl') + '<span class="big">' + t('whistle') + '</span><span class="hint">' + t('whistleNote') + '</span><span class="hint">' + t('tapToStop') + '</span></div>';
  if (TOOL === 'card') {
    var c = S.card, lang = c.lang || (li() ? 'Mandarin Chinese (中文)' : 'English');
    return '<div class="helpcard" role="dialog" aria-modal="true"><div class="hc-in"><div class="hc-big">I NEED HELP</div><div class="hc-zh">我需要帮助</div>' +
      '<div class="hc-line">Please call 000 for me.</div><div class="hc-line" style="font-size:1.375rem">I speak: ' + esc(lang) + '</div>' +
      (cardKV() || c.name ? '<dl>' + (c.name ? '<dt>Name</dt><dd>' + esc(c.name) + '</dd>' : '') + cardKV() + '</dl>' : '') +
      '<button class="btn btn-lg" data-a="toolStop">' + t('close') + '</button></div></div>';
  }
  return '';
}
function startTool(k){
  TOOL = k; renderLayer();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); } catch (e) {}
  if (k === 'flash') {
    /* S O S : dot = 1 unit, dash = 3 units; 1 unit = 300 ms (under 3 flashes per second) */
    var U = 300, seq = [], add = function(on, u){ seq.push([on, u * U]); };
    [1, 1, 1].forEach(function(d){ add(1, d); add(0, 1); }); seq[seq.length - 1][1] = 3 * U;
    [3, 3, 3].forEach(function(d){ add(1, d); add(0, 1); }); seq[seq.length - 1][1] = 3 * U;
    [1, 1, 1].forEach(function(d){ add(1, d); add(0, 1); }); seq[seq.length - 1][1] = 7 * U;
    var i = 0;
    (function stepf(){ var el = document.getElementById('flash'); if (!el || TOOL !== 'flash') return; var s = seq[i % seq.length]; el.classList.toggle('flash-on', !!s[0]); i++; toolTimer = setTimeout(stepf, s[1]); })();
  }
  if (k === 'whistle') {
    try {
      var AC = window.AudioContext || window.webkitAudioContext; audio = new AC();
      var osc = audio.createOscillator(), g = audio.createGain(); osc.type = 'square'; osc.frequency.value = 3150; g.gain.value = 0;
      osc.connect(g); g.connect(audio.destination); osc.start();
      var n = 0;
      (function blast(){ if (TOOL !== 'whistle') return; var inBurst = n % 4 < 3; g.gain.setTargetAtTime(inBurst ? 0.5 : 0, audio.currentTime, 0.01);
        setTimeout(function(){ g.gain.setTargetAtTime(0, audio.currentTime, 0.01); n++; toolTimer = setTimeout(blast, inBurst ? 300 : 900); }, inBurst ? 600 : 10); })();
    } catch (e) { toast('Audio not available'); }
  }
}
function stopTool(){
  TOOL = null; clearTimeout(toolTimer);
  if (audio) { try { audio.close(); } catch (e) {} audio = null; }
  if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  renderLayer();
}

/* ---------- actions ---------- */
function contacts(){
  var n = S.plan.people.map(function(p){ return (p.phone || '').replace(/[^\d+]/g, ''); }).filter(Boolean);
  if (S.card.contactPhone) n.push(S.card.contactPhone.replace(/[^\d+]/g, ''));
  return n.filter(function(x, i, a){ return a.indexOf(x) === i; });
}
function withLocation(cb){
  if (!navigator.geolocation) return cb(null);
  var done = false;
  navigator.geolocation.getCurrentPosition(function(p){ if (done) return; done = true; cb({ lat: p.coords.latitude, lng: p.coords.longitude }); },
    function(){ if (done) return; done = true; cb(null); }, { timeout: 6000, maximumAge: 120000, enableHighAccuracy: true });
  setTimeout(function(){ if (!done) { done = true; cb(null); } }, 7000);
}
function sendSms(body){
  var n = contacts();
  if (!n.length) { toast(t('safeNoContacts')); location.hash = '#/prepare/plan'; return; }
  location.href = 'sms:' + n.join(',') + '?&body=' + encodeURIComponent(body);
}
function sendSafe(){
  withLocation(function(c){
    var body = t('safeMsg');
    if (c) body += '\n' + t('safeWhere') + ': https://maps.google.com/?q=' + c.lat.toFixed(5) + ',' + c.lng.toFixed(5);
    sendSms(body);
  });
}
var A = {
  obLang: function(el){ S.pre = el.dataset.v; renderLayer(); },
  obStart: function(){ S.lang = S.pre || 'en'; delete S.pre; save(); render(); },
  demoAlert: function(){ S.demo.alert = true; S.demo.answered = false; CI = null; save(); location.hash = '#/'; render(); },
  demoToggle: function(){ S.demo.alert = !S.demo.alert; S.demo.answered = false; save(); render(); },
  checkin: function(){ CI = 'affected'; renderLayer(); },
  ciYes: function(){ CI = 'help'; renderLayer(); },
  ciNo: function(){ CI = null; S.demo.answered = true; save(); renderLayer(); },
  ciClose: function(){ CI = null; S.demo.answered = true; save(); renderLayer(); },
  ciSafe: function(){ CI = null; S.demo.answered = true; save(); renderLayer(); sendSafe(); },
  safe: function(){ sendSafe(); },
  tool: function(el){ startTool(el.dataset.t); },
  toolStop: function(){ stopTool(); },
  hrInj: function(el){ HR.inj = el.dataset.v; render(); },
  hrPeople: function(el){ HR.people = Math.max(1, Math.min(50, HR.people + +el.dataset.d)); render(); },
  hrNeed: function(el){ HR.needs[el.dataset.v] = !HR.needs[el.dataset.v]; render(); },
  hrToggle: function(el){ HR[el.dataset.v] = !HR[el.dataset.v]; render(); },
  hrSend: function(el){
    el.disabled = true;
    var go = function(c){ if (c) HR.coords = c.lat.toFixed(4) + ', ' + c.lng.toFixed(4); location.hash = '#/sos/help/sent'; };
    if (HR.loc) withLocation(go); else go(null);
  },
  hrSms: function(){
    var nmap = { water: 'needWater', food: 'needFood', meds: 'needMeds', shelter: 'needShelter', transport: 'needTransport', power: 'needPower' };
    var needs = Object.keys(HR.needs).filter(function(k){ return HR.needs[k]; }).map(function(k){ return t(nmap[k]); }).join(', ');
    var body = t('needHelp') + '. ' + t('hrPeople') + ' ' + HR.people + '. ' + (needs ? t('hrNeed') + ' ' + needs + '. ' : '') + (HR.note ? HR.note + ' ' : '') +
      (HR.coords ? '\nhttps://maps.google.com/?q=' + HR.coords.replace(/\s/g, '') : '');
    sendSms(body);
  },
  kitPeople: function(el){ S.kit.people = Math.max(1, Math.min(12, S.kit.people + +el.dataset.d)); save(); render(); },
  kitToggle: function(el){ S.kit[el.dataset.v] = !S.kit[el.dataset.v]; save(); render(); },
  kitItem: function(el){ S.kit.have[el.dataset.v] = !S.kit.have[el.dataset.v]; save(); render(); },
  planAdd: function(){ S.plan.people.push({ name: '', phone: '' }); save(); render(); },
  planRm: function(el){ S.plan.people.splice(+el.dataset.i, 1); if (!S.plan.people.length) S.plan.people.push({ name: '', phone: '' }); save(); render(); },
  planShare: function(){
    var p = S.plan, lines = ['DEWS — ' + t('planTitle')];
    p.people.forEach(function(x){ if (x.name || x.phone) lines.push('• ' + x.name + ' ' + x.phone); });
    if (p.near) lines.push(t('planMeetNear') + ': ' + p.near);
    if (p.far) lines.push(t('planMeetFar') + ': ' + p.far);
    if (p.contact) lines.push(t('planContact') + ': ' + p.contact);
    if (p.trigger) lines.push(t('planTrigger') + ': ' + p.trigger);
    var text = lines.join('\n');
    if (navigator.share) navigator.share({ text: text }).catch(function(){});
    else location.href = 'sms:?&body=' + encodeURIComponent(text);
  },
  quizStart: function(){ Q = { i: 0, picked: null, score: 0 }; render(); },
  quizPick: function(el){ if (Q.picked != null) return; Q.picked = +el.dataset.i; if (Q.picked === QUIZ[Q.i].ok) Q.score++; render(); },
  quizNext: function(){ Q.i++; Q.picked = null; if (Q.i >= QUIZ.length) { S.quiz.best = Math.max(S.quiz.best || 0, Q.score); save(); } render(); window.scrollTo(0, 0); },
  filter: function(el){ filter = el.dataset.v; render(); },
  locate: function(){ toast(t('mapLocating')); withLocation(function(c){ here = c; render(); }); },
  compass: function(){
    if (heading != null) { heading = null; window.removeEventListener('deviceorientation', onOrient); render(); return; }
    var start = function(){ window.addEventListener('deviceorientation', onOrient); heading = 0; render(); };
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
      DeviceOrientationEvent.requestPermission().then(function(s){ if (s === 'granted') start(); }).catch(function(){});
    else start();
  },
  set: function(el){ S[el.dataset.k] = el.dataset.v; save(); render(); },
  reset: function(){
    if (!resetArmed) { resetArmed = true; render(); setTimeout(function(){ resetArmed = false; }, 4000); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = JSON.parse(JSON.stringify(DEFAULTS)); resetArmed = false; location.hash = '#/'; render();
  }
};
var lastOrient = 0;
function onOrient(e){
  var h = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (h == null) return; heading = h;
  var now = Date.now(); if (now - lastOrient < 150) return; lastOrient = now;
  if (parts()[0] === 'map') { var y = window.scrollY; render(); window.scrollTo(0, y); }
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if (!el) return;
  var fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset.bind) { setPath(S, el.dataset.bind, el.value); save(); }
  if (el.dataset.hr && HR) HR[el.dataset.hr] = el.value;
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (TOOL) stopTool(); else if (CI) A.ciClose(); } });
window.addEventListener('hashchange', function(){ render(); window.scrollTo(0, 0); });
window.addEventListener('online', render); window.addEventListener('offline', render);
function after(p){ var m = document.getElementById('main'); if (m && p[0] === 'sos' && p[3]) { var n = m.querySelector('.now'); if (n) n.setAttribute('tabindex', '-1'); } }

/* ---------- offline ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; })
    .then(function(){ swReady = true; if (S.lang) { var y = window.scrollY; render(); window.scrollTo(0, y); } }).catch(function(){});
}
render();
})();
